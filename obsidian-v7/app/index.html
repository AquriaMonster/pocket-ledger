</style><link rel="stylesheet" href="./obsidian.css"></head><body><main><header><span class="brand"><span class="mark" aria-hidden="true">≋</span>Pocket Ledger <em>OBSIDIAN</em></span></header><nav id="nav" aria-label="Main"></nav><div id="view"></div></main><dialog id="composer" aria-labelledby="entry-title"></dialog><dialog id="dlg" aria-labelledby="modal-title"><div id="modal"></div></dialog><output id="toast" aria-live="polite"></output><script src="./compat.js"></script><script>'use strict';
const categories = 'Khoraki Sx Sobune Digital Qaza Fun Travel Gift Beauty Internet Other VPN Mental Health Fitness Education'.split(' ');
const types = {expense:'Expense',income:'Income',transfer:'Transfer',fill:'Shahrdari Fill',received:'Shahrdari Received',returned:'Shahrdari Return'};
function check(ok,message){if(!ok) throw Error(message)}
function digits(s){return String(s).trim().replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace('٫','.')}
function amount(s,unit=1000){
 const value=digits(s);
 check(/^\d+(\.\d{1,3})?$/.test(value),'Enter a positive number or zero, without separators.');
 const [whole,fraction='']=value.split('.');
 const mills=BigInt(whole)*1000n+BigInt(fraction.padEnd(3,'0'));
 const scaled=mills*BigInt(unit);
 check(scaled%1000n===0n && scaled/1000n<=99999999999999n,'Enter a whole-toman amount within the supported range.');
 return Number(scaled/1000n);
}
function fresh(){return {version:1,start:'',accounts:['Shahr','Blu','Keshavarzi'].map((name,i)=>({id:'a'+i,name,opening:0,active:true})),cats:categories.map((name,i)=>({id:'c'+i,name,active:true})).filter(c=>c.id!=='c1'),openingDebt:0,rows:[],audit:[],unit:1000,theme:'dark',recipient:'Repayment recipient',card:'',recent:{}}}
const fmt=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
function persian(date){let p=Object.fromEntries(fmt.formatToParts(date).map(x=>[x.type,x.value]));return [p.year,p.month,p.day].map((n,i)=>i?String(n).padStart(2,'0'):n).join('-')}
function today(){const d=new Date();return persian(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())))}
const monthDays=new Map();
function days(month){
 if(monthDays.has(month))return monthDays.get(month);
 const [y,m]=month.split('-').map(Number);
 check(y>=1300&&y<=1550&&m>=1&&m<=12,'Use a Jalali year from 1300 to 1550 and month 01–12.');
 let result=0;
 for(let i=-8;i<42;i++){const key=persian(new Date(Date.UTC(y+621,m+1,21+i)));if(key.startsWith(month+'-'))result=Math.max(result,Number(key.slice(-2)))}
 monthDays.set(month,result);return result;
}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&+s.slice(-2)>0&&+s.slice(-2)<=days(s.slice(0,7))}
function monthShift(key,n){let [y,m]=key.split('-').map(Number);let t=y*12+m-1+n;return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0')}
function summary(s,month){
 const balance=Object.fromEntries(s.accounts.map(a=>[a.id,a.opening]));
 let debt=s.openingDebt,income=0,expense=0,fill=0,received=0,returned=0;const by={};
 for(const r of s.rows){
  const period=r.date.slice(0,7);if(period>month)continue;
  const n=r.amount;const current=period===month;
  balance[r.account]+=(['income','received'].includes(r.type)?n:-n);
  if(['transfer','fill'].includes(r.type))balance[r.to]+=n;
  if(r.type==='received'){debt+=n;if(current)received+=n}
  if(r.type==='returned'){debt-=n;if(current)returned+=n}
  if(current && r.type==='expense'){expense+=n;by[r.cat]=(by[r.cat]||0)+n}
  if(current && r.type==='income')income+=n;
  if(current && r.type==='fill')fill+=n;
 }
 const total=Object.values(balance).reduce((a,b)=>a+b,0);
 return {balance,debt,total,net:total-debt,gap:Math.max(0,debt-(balance.a0??0)),expense,income,fill,received,returned,by};
}
function validate(s){
 check(s&&s.version===1&&validDate(s.start)&&s.start<=today(),'Opening date must be valid and no later than today.');
 const money=n=>Number.isSafeInteger(n)&&n>=0&&n<=99999999999999;
 check(money(s.openingDebt)&&[1,1000].includes(s.unit),'Invalid opening debt or input unit.');
 check(['light','dark','system'].includes(s.theme)&&typeof s.recipient==='string'&&typeof s.card==='string'&&/^(\d{16})?$/.test(s.card)&&s.recent&&typeof s.recent==='object','Invalid preferences.');
 for(const collection of [s.accounts,s.cats]){
  check(Array.isArray(collection)&&collection.length,'Account or category list missing.');
  const ids=new Set(),names=new Set();
  for(const item of collection){check(typeof item.id==='string'&&/^[a-z0-9-]+$/i.test(item.id)&&!ids.has(item.id)&&typeof item.name==='string'&&item.name.trim()&&!names.has(item.name.trim().toLowerCase())&&typeof item.active==='boolean','Duplicate or invalid account/category.');ids.add(item.id);names.add(item.name.trim().toLowerCase())}
 }
 const account=id=>s.accounts.some(a=>a.id===id);
 check(s.accounts.every(a=>money(a.opening))&&(account('a0')||s.openingDebt===0),'Invalid opening balances or missing loan account.');
 check(Array.isArray(s.rows)&&Array.isArray(s.audit)&&s.audit.every(e=>e&&typeof e.at==='string'&&typeof e.action==='string'),'Invalid records or audit history.');
 const ids=new Set(),daily=new Map();let bound=s.openingDebt+s.accounts.reduce((v,a)=>v+a.opening,0);
 for(const r of s.rows){
  check(r&&typeof r.id==='string'&&/^[a-z0-9-]+$/i.test(r.id)&&!ids.has(r.id),'Duplicate or invalid transaction ID.');ids.add(r.id);
  check(Object.hasOwn(types,r.type)&&money(r.amount)&&r.amount>0&&validDate(r.date)&&r.date>=s.start&&account(r.account)&&typeof r.note==='string','Check transaction amount, date, type and account.');
  if(r.type==='expense')check(s.cats.some(c=>c.id===r.cat),'Select a known expense category.');
  if(['fill','transfer'].includes(r.type))check(account(r.to)&&r.account!==r.to,'Choose two different accounts.');
  if(r.type==='received')check(r.account==='a0','Shahrdari deposits go to the Shahr account.');
  if(r.type==='returned')check(account('a0'),'Loan history requires the original loan account.');
  if(r.type==='fill')check(r.to==='a0','A fill must replenish the Shahr account.');
  if(['received','returned'].includes(r.type))daily.set(r.date,(daily.get(r.date)||0)+(r.type==='received'?r.amount:-r.amount));
  bound+=2*r.amount;
 }
 check(Number.isSafeInteger(bound),'Ledger exceeds the supported whole-toman range.');
 let debt=s.openingDebt;for(const date of [...daily.keys()].sort()){debt+=daily.get(date);check(debt>=0,'Repayment exceeds the outstanding debt on '+date+'.')}
 return s;
}
if(typeof module!=='undefined')module.exports={fresh,summary,validate,amount,monthShift,days};

</script><script>const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 });

}
function formData(form){return Object.fromEntries(new FormData(form))}
function field(label,name,value='',extra=''){return '<label>'+esc(label)+'<input name="'+name+'" value="'+esc(value)+'" '+extra+'></label>'}

function download(name,body,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

function openingFields(){return field('Opening date · Jalali YYYY-MM-DD','start',state.start||today(),'required')+'<div class="fields">'+state.accounts.map(a=>field(a.name,a.id,state.start?a.opening:'','required inputmode="numeric"')).join('')+(state.accounts.some(a=>a.id==='a0')?field('Outstanding Shahrdari debt','debt',state.start?state.openingDebt:'','required inputmode="numeric"'):'')+'</div>'}
async function setOpening(f){const s=clone(state);s.start=digits(f.start);s.accounts.forEach(a=>a.opening=amount(f[a.id],1));s.openingDebt=state.accounts.some(a=>a.id==='a0')?amount(f.debt,1):0;const snapshot=x=>({date:x.start,balances:x.accounts.map(a=>[a.id,a.opening]),debt:x.openingDebt});await save(s,state.start?'Corrected opening values':'Set opening values',snapshot(state),snapshot(s))}

 if(!state.start){$('nav').innerHTML='';$('view').innerHTML='<section class="setup"><h1>Your opening balances</h1><p>Enter today’s card balances and outstanding debt in full toman. You can correct them later.</p><form class="box">'+openingFields()+'<p class="err" role="alert"></p><button class="primary">Start my ledger</button></form><button id="restore">Restore a backup</button></section>';installExample();bindForm($('view').querySelector('form'),setOpening);$('restore').onclick=restore;return}

function bankLabel(key){return '<span class="bank" data-bank="'+esc(key)+'">'+esc(accountName(key))+'</span>'}
function rowList(rows){return rows.map(r=>'<div class="entry"><div><b>'+esc(masked?displayType(r.type):r.note||displayType(r.type))+'</b><small>'+esc(r.date)+' · '+bankLabel(r.account)+(r.to?' → '+bankLabel(r.to):'')+' · '+esc(r.type==='expense'?categoryName(r.cat):displayType(r.type))+'</small></div><div><b>'+money(r.amount)+'</b> <button data-edit="'+esc(r.id)+'" aria-label="Edit transaction">Edit</button></div></div>').join('')||'<p class="muted">No transactions here yet.</p>'}
function wireRows(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editLedgerRow(b.dataset.edit))}
function metric(label,n){return '<div class="entry"><span>'+esc(label)+'</span><b>'+money(n)+'</b></div>'}

function transactions(){const all={id:'',name:'All'};$('content').innerHTML='<div class="box"><div class="fields">'+field('Search','query','','id="query" placeholder="Name, category, account or amount"')+select('Account','filter',[all,...state.accounts],'')+select('Type','type',[all,...Object.entries(types).filter(([id])=>id!=='fill'&&(!['received','returned'].includes(id)||loanEnabled()||state.rows.some(r=>r.type===id))).map(([id,name])=>({id,name}))],'')+select('Category','category',[all,...state.cats],'')+'</div><div id="results"></div></div>';const area=$('content'),val=n=>area.querySelector('[name="'+n+'"]').value;function filter(){let q=val('query').toLowerCase();$('results').innerHTML=rowList(rowsMonth().filter(r=>(!val('filter')||[r.account,r.to].includes(val('filter')))&&(!val('type')||(r.type==='fill'?'transfer':r.type)===val('type'))&&(!val('category')||r.cat===val('category'))&&[r.note,displayType(r.type),categoryName(r.cat),accountName(r.account),accountName(r.to),r.amount].join(' ').toLowerCase().includes(q)));wireRows()}area.oninput=filter;filter()}

 $('content').innerHTML='<details open><summary>Preferences</summary><form id="prefs">'+select('Transaction amount entry','unit',[{id:'1000',name:'Thousands of toman · 1 means 1,000'},{id:'1',name:'Full toman'}],String(state.unit))+(loanEnabled()?field('Repayment recipient','recipient',state.recipient,'required')+field('Recipient card · optional, kept on this device','card',state.card,'type="password" inputmode="numeric" autocomplete="off"')+'<button type="button" id="reveal">Show / hide card</button> ':'')+'<button class="primary">Save preferences</button><p class="err"></p></form></details>'+manage('accounts','Accounts')+roundupSettingsHtml()+manage('cats','Expense categories')+'<details><summary>Opening values</summary><p>Corrections recalculate every affected month.</p><button id="opening">Correct opening values</button></details><details open><summary>Backup &amp; export</summary><p>Data belongs to this browser on this device. Clearing browser storage removes it. Move your ledger by downloading a JSON backup and restoring it on the other device. The backup contains your private ledger data in plain text.</p><div class="chips"><button id="backup">Download JSON backup</button><button id="restore">Restore backup</button><button id="csv">Export CSV</button></div></details><p class="creation-credit">Created by Aria and Buddy</p><p class="build-version">Obsidian · 7.7</p>';
 wireRoundupSettings();wireAccountRemoval();
 if($('reveal'))$('reveal').onclick=()=>{const el=$('prefs').elements.card;el.type=el.type==='password'?'text':'password'};
 bindForm($('prefs'),async f=>{const s=clone(state);Object.assign(s,{unit:Number(f.unit),theme:'dark',recipient:f.recipient===undefined?s.recipient:f.recipient.trim(),card:f.card===undefined?s.card:digits(f.card).replace(/[ -]/g,'')});await save(s,'Updated preferences',null,null)});
 $('opening').onclick=()=>modal('Correct opening values',openingFields(),async f=>{check(digits(f.start)<=today(),'Opening date cannot be in the future.');await setOpening(f)});

 $('csv').onclick=()=>{const cell=x=>{let v=String(x??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};const rows=[['ID','Jalali date','Type','Amount (toman)','Account','To account','Category','Description'],...state.rows.map(r=>[r.id,r.date,types[r.type],r.amount,accountName(r.account),accountName(r.to),categoryName(r.cat),r.note])];download('PocketLedger-transactions.csv','\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
 document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const key=b.dataset.key,old=state[key].find(x=>x.id===b.dataset.item);
 modal((old?'Edit ':'Add ')+(key==='accounts'?'account':'category'),field('Name','name',old?.name,'required maxlength="60"')+(key==='accounts'?colorField(old):'')+(old&&key==='cats'?'<label><span><input type="checkbox" name="active" '+(old.active?'checked':'')+'> Active for new entries</span></label>':''),async f=>{const s=clone(state),x={...(old||{id:id(),...(key==='accounts'?{opening:0}:{})}),name:f.name.trim(),active:old?(key==='accounts'?old.active:!!f.active):true};if(key==='accounts')x.color=f.color;if(old)s[key][s[key].findIndex(a=>a.id===x.id)]=x;else s[key].push(x);await save(s,'Changed '+(key==='cats'?'category':'account'),old||null,x)})});
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=async()=>{try{const s=clone(state),i=s.cats.findIndex(a=>a.id===b.dataset.up);[s.cats[i],s.cats[i-1]]=[s.cats[i-1],s.cats[i]];await save(s,'Reordered categories',state.cats.map(c=>c.id),s.cats.map(c=>c.id));[...$('content').querySelectorAll('details')].find(d=>d.firstChild.textContent==='Expense categories').open=true}catch(e){alert(e.message)}});
}
